name: Scrape sales

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours, at :17 past (UTC)
  workflow_dispatch:             # "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Page Yahoo all the way back (~180 days) instead of stopping at known sales"
        type: boolean
        default: false

permissions:
  contents: write                # lets the run commit data/sales.json

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape Yahoo! Auctions, Yahoo!フリマ and Mercari
        run: python scraper/tracker.py ${{ inputs.full && '--full' || '' }}

      - name: Save to the repo
        run: |
          git config user.name "sales-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sales.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update sales $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The site may have saved a ✕/✓ to data/overrides.json while this ran; rebase onto it.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
